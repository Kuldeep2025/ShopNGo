<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>You are offline - ShopNGo</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f9fafb; color: #111827; }
    main { max-width: 32rem; margin: 0 auto; padding: 4rem 1.25rem; text-align: center; }
    img { width: 96px; height: 96px; border-radius: 20px; }
    h1 { font-size: 1.5rem; margin: 1.25rem 0 .5rem; }
    p { line-height: 1.6; color: #374151; }
    button { margin-top: 1.25rem; font: inherit; font-weight: 600; padding: .75rem 1.5rem; border: 0; border-radius: .5rem; background: #0f766e; color: #fff; cursor: pointer; }
    button:focus-visible { outline: 3px solid #0f172a; outline-offset: 2px; }
  </style>
</head>
<body>
  <main id="main">
    <img src="/icon-192.png" alt="ShopNGo logo" width="96" height="96">
    <h1>You are offline</h1>
    <p>ShopNGo could not reach the internet. Pages you opened before may still work. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
