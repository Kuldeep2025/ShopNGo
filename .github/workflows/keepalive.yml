name: keepalive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping site
        run: |
          curl -fsS -m 60 https://shopngo-kuldeep.onrender.com/health || curl -fsS -m 60 https://shopngo-kuldeep.onrender.com/ || true
